<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalmRoute Melbourne CBD</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main id="map" aria-label="Interactive map of Melbourne CBD"></main>

  <header class="topbar glass-panel">
    <div class="brand">
      <div class="brand-icon">C</div>
      <div>
        <h1>CalmRoute</h1>
        <p>Melbourne CBD sensory-aware navigation</p>
      </div>
    </div>
    <button id="themeToggle" class="icon-button" aria-label="Switch colour mode" title="Switch colour mode">☾</button>
  </header>

  <section class="search-panel glass-panel" aria-label="Route search">
    <label for="startInput">Starting point</label>
    <div class="search-field">
      <div class="search-row">
        <input id="startInput" type="text" autocomplete="off" placeholder="Search a Melbourne CBD location">
        <button id="useLocationButton" class="secondary-button" title="Use current location" aria-label="Use current location">◎</button>
      </div>
      <div id="startSearchResults" class="search-results hidden" role="listbox" aria-label="Starting point suggestions"></div>
    </div>

    <label for="destinationInput">Destination</label>
    <div class="search-field">
      <div class="search-row">
        <input id="destinationInput" type="text" autocomplete="off" placeholder="Where would you like to go?">
        <button id="routeButton" class="primary-button">Find calm route</button>
      </div>
      <div id="destinationSearchResults" class="search-results hidden" role="listbox" aria-label="Destination suggestions"></div>
    </div>

    <div id="routeActions" class="quick-actions hidden" aria-label="Route layers">
      <button id="safeSpacesButton" class="chip active">Safe spaces</button>
      <button id="crowdButton" class="chip active">Crowd alerts</button>
      <button id="clearButton" class="chip">Clear route</button>
    </div>

  </section>

  <aside id="routeSummary" class="route-summary glass-panel hidden">
    <button id="closeSummary" class="close-button" aria-label="Close route overview">×</button>
    <h2>Route overview</h2>
    <div class="summary-grid">
      <div><span id="distanceValue">—</span><small>Distance</small></div>
      <div><span id="durationValue">—</span><small>Walking time</small></div>
      <div><span id="alertValue">—</span><small>High alerts</small></div>
    </div>
    <div id="alertMessage" class="alert-message"></div>
  </aside>

  <div id="legend" class="legend glass-panel hidden">
    <strong>Predicted crowd coverage</strong>
    <span><i class="dot low"></i>Low</span>
    <span><i class="dot medium"></i>Medium</span>
    <span><i class="dot high"></i>High</span>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
